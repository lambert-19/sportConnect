# Telegraf Configuration for SportConnect

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "sportconnect-telegraf"
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# Read metrics from Kafka topic 'sensor-raw'
[[inputs.kafka_consumer]]
  ## Kafka brokers
  ## Si Telegraf tourne dans Docker et dans le même réseau que Kafka : sc_kafka:29092
  brokers = ["sc_kafka:29092"]

  ## Topics to consume
  topics = ["sensor-raw"]

  ## Consumer Group
  consumer_group = "telegraf_metrics_group"

  ## Data format
  data_format = "json"
  
  ## Tag keys (Important: ces champs deviendront des tags indexés dans InfluxDB)
  tag_keys = ["user_id", "activity_id", "sensor_type"]
  
  ## JSON Name Key (optionnel: utilise un champ du JSON pour nommer la mesure)
  # json_name_key = "metric_name"

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Write metrics to InfluxDB v2 (Cloud)
[[outputs.influxdb_v2]]
  ## L'URL doit pointer vers l'endpoint Cloud (ex: https://eu-central-1-1.aws.cloud2.influxdata.com)
  urls = ["${INFLUXDB_URL}"]

  ## Token API avec droits d'écriture sur le bucket
  token = "${INFLUXDB_TOKEN}"

  ## Organisation (Nom ou ID)
  organization = "${INFLUXDB_ORG}"

  ## Bucket de destination
  bucket = "${INFLUXDB_BUCKET}"
