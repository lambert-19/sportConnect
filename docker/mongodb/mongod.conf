# =============================================================
# SportConnect — MongoDB 7.0 Configuration
# En production : paramètres gérés par MongoDB Atlas
# =============================================================

storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.0            # 50% RAM disponible
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy     # Compression par défaut des collections
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0
  component:
    query:
      verbosity: 1               # Log les slow queries

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 200

operationProfiling:
  slowOpThresholdMs: 100         # Profiler les requêtes > 100ms
  mode: slowOp

replication:
  replSetName: "rs0"             # Requis pour activer le replica set
  oplogSizeMB: 1024              # 1Go d'oplog pour PITR

security:
  authorization: enabled

