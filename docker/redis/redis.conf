# =============================================================
# SportConnect — Redis 7 Configuration
# En production : GCP Memorystore Standard Tier
# =============================================================

# ------- Réseau -------
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ------- Mémoire -------
maxmemory 1gb
maxmemory-policy allkeys-lru      # Éviction LRU (libère les clés les moins utilisées)
maxmemory-samples 10              # Précision LRU (5=rapide, 10=précis)

# ------- Persistance — RDB snapshot toutes les 6h -------
# (pas de source de vérité dans Redis — snapshot légère suffisante)
save 21600 1                      # Si ≥1 clé modifiée en 6h → snapshot
save 3600 100                     # Si ≥100 clés modifiées en 1h → snapshot
save 900 10000                    # Si ≥10000 clés modifiées en 15min → snapshot
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ------- AOF désactivé (Redis = cache, pas source de vérité) -------
appendonly no

# ------- Sécurité -------
# requirepass défini via variable d'environnement dans docker-compose

# ------- Slow log -------
slowlog-log-slower-than 10000     # Commandes > 10ms
slowlog-max-len 128

# ------- Structures de données (politiques de cache SportConnect) -------
# profile:{username}           STRING JSON  TTL=300s
# feed:{user_id}               LIST max=200 TTL=600s
# leaderboard:{sport}:{week}   SORTED SET   TTL=1209600s (14j)
# likes:{activity_id}          SET          TTL=86400s
# session:{token}              STRING JSON  TTL=3600s (SETEX)

# ------- Lazy freeing (évite les blocages sur DEL de grosses structures) -------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ------- Logs -------
loglevel notice
logfile ""

# ------- Cluster (désactivé en dev, activé si > 25Go données actives) -------
cluster-enabled no
