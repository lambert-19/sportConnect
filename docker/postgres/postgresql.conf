# =============================================================
# SportConnect — PostgreSQL 16 Configuration
# Profil : développement local / staging
# En production (Cloud SQL) ces paramètres sont gérés par GCP
# =============================================================

# ------- Connexions -------
max_connections = 200
superuser_reserved_connections = 5

# ------- Mémoire -------
shared_buffers = 512MB            # 25% de la RAM (2Go recommandé)
effective_cache_size = 1536MB     # 75% RAM
work_mem = 8MB                    # par tri/hachage par connexion
maintenance_work_mem = 128MB      # VACUUM, CREATE INDEX

# ------- WAL / Durabilité -------
wal_level = replica               # Requis pour la réplication + PITR
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_senders = 5
wal_keep_size = 256               # MB
synchronous_commit = on           # Garantie durabilité (ACID)

# ------- Réplication -------
hot_standby = on
hot_standby_feedback = on

# ------- Performances / planificateur -------
random_page_cost = 1.1            # SSD (vs 4.0 pour disque rotatif)
effective_io_concurrency = 200    # SSD
default_statistics_target = 100

# ------- Extensions préchargées -------
shared_preload_libraries = 'pg_stat_statements,pgcrypto'

# ------- Logging -------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_min_duration_statement = 500  # Log requêtes > 500ms
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off             # Trop verbeux en prod
log_lock_waits = on
log_temp_files = 0

# ------- Autovacuum -------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ------- Partitionnement -------
enable_partition_pruning = on
constraint_exclusion = partition

# ------- Sécurité -------
ssl = on
password_encryption = scram-sha-256
